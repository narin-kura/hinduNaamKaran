<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <defs>
    <radialGradient id="mo" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#ea580c"/></radialGradient>
    <radialGradient id="my" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <linearGradient id="leaf" x1="0" x2="1"><stop offset="0" stop-color="#15803d"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <g id="flower">
      <circle r="7.5" fill="url(#mo)"/>
      <circle r="7.5" fill="none" stroke="#c2410c" stroke-width=".8" stroke-dasharray="2 1.6" opacity=".7"/>
    </g>
    <g id="flowerY">
      <circle r="7" fill="url(#my)"/>
      <circle r="7" fill="none" stroke="#d97706" stroke-width=".8" stroke-dasharray="2 1.6" opacity=".7"/>
    </g>
    <path id="mango" d="M0,0 C9,8 10,28 0,44 C-10,28 -9,8 0,0Z" fill="url(#leaf)"/>
  </defs>
  <!-- string -->
  <path d="M0,8 Q120,30 240,8" fill="none" stroke="#b45309" stroke-width="2"/>
  <!-- mango leaves -->
  <g transform="translate(30,13) rotate(8)"><use href="#mango"/><path d="M0,3 V40" stroke="#14532d" stroke-width=".8" opacity=".6"/></g>
  <g transform="translate(70,19) rotate(4)"><use href="#mango"/><path d="M0,3 V40" stroke="#14532d" stroke-width=".8" opacity=".6"/></g>
  <g transform="translate(170,19) rotate(-4)"><use href="#mango"/><path d="M0,3 V40" stroke="#14532d" stroke-width=".8" opacity=".6"/></g>
  <g transform="translate(210,13) rotate(-8)"><use href="#mango"/><path d="M0,3 V40" stroke="#14532d" stroke-width=".8" opacity=".6"/></g>
  <!-- marigold strand in the middle -->
  <path d="M120,19 V82" stroke="#b45309" stroke-width="1"/>
  <use href="#flower" x="120" y="27"/><use href="#flowerY" x="120" y="41"/><use href="#flower" x="120" y="55"/><use href="#flowerY" x="120" y="69"/>
  <path d="M116,77 L120,90 L124,77Z" fill="#dc2626"/>
  <!-- marigolds on the string ends (seamless join) -->
  <use href="#flowerY" x="0" y="9"/><use href="#flowerY" x="240" y="9"/>
  <use href="#flower" x="50" y="17"/><use href="#flower" x="190" y="17"/>
</svg>
