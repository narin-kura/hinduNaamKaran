<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="480" height="110">
  <!-- string (one seamless swag per 480px) -->
  <path d="M0,8 Q120,26 240,8 Q360,26 480,8" fill="none" stroke="#b08a2e" stroke-width="2"/>
  <g stroke="#b08a2e" stroke-width="1.2">
    <path d="M30,13 V28"/><path d="M90,19 V30"/><path d="M150,19 V26"/><path d="M210,13 V24"/>
    <path d="M270,13 V26"/><path d="M330,19 V28"/><path d="M390,19 V26"/><path d="M450,13 V24"/>
  </g>

  <!-- 1 rattle (pink) -->
  <g transform="translate(30,28)">
    <circle cx="0" cy="12" r="11" fill="#f9a8d4" stroke="#db2777" stroke-width="1.5"/>
    <circle cx="-4" cy="9" r="3" fill="#fff" opacity=".7"/>
    <rect x="-2.5" y="22" width="5" height="18" rx="2.5" fill="#fbcfe8" stroke="#db2777" stroke-width="1.2"/>
    <circle cx="0" cy="42" r="4.5" fill="#f9a8d4" stroke="#db2777" stroke-width="1.2"/>
  </g>

  <!-- 2 feeding bottle (sky blue) -->
  <g transform="translate(90,30)">
    <path d="M-3,0 Q0,-6 3,0 L4,6 H-4Z" fill="#fde68a" stroke="#ca8a04" stroke-width="1"/>
    <rect x="-8" y="6" width="16" height="5" rx="1.5" fill="#7dd3fc" stroke="#0e7490" stroke-width="1"/>
    <rect x="-9" y="11" width="18" height="30" rx="6" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.3"/>
    <rect x="-9" y="26" width="18" height="15" rx="6" fill="#fff" opacity=".9"/>
    <path d="M-4,17 H2 M-4,22 H2 M-4,27 H2" stroke="#0e7490" stroke-width="1"/>
  </g>

  <!-- 3 star (gold) -->
  <g transform="translate(150,26)">
    <path d="M0,0 L5,11 L17,12 L8,20 L11,32 L0,26 L-11,32 L-8,20 L-17,12 L-5,11Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.3" stroke-linejoin="round"/>
  </g>

  <!-- 4 cradle / uyyala (wood + mint) -->
  <g transform="translate(210,24)">
    <path d="M0,0 L-16,14 M0,0 L16,14" stroke="#b08a2e" stroke-width="1.2"/>
    <path d="M-20,14 Q0,40 20,14Z" fill="#a7f3d0" stroke="#0f766e" stroke-width="1.4"/>
    <path d="M-20,14 H20" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-6" cy="22" r="1.6" fill="#f472b6"/><circle cx="0" cy="25" r="1.6" fill="#fde047"/><circle cx="6" cy="22" r="1.6" fill="#f472b6"/>
  </g>

  <!-- 5 booties (lilac pair): cuff on top, rounded toe to the right -->
  <g transform="translate(270,26)">
    <g transform="translate(-16,0)">
      <rect x="-7" y="0" width="14" height="6" rx="2" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.1"/>
      <path d="M-7,6 V20 Q-7,28 1,28 H8 Q15,28 15,22 Q15,17 8,17 H7 V6Z" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2"/>
      <circle cx="1" cy="11" r="1.6" fill="#f472b6"/>
    </g>
    <g transform="translate(6,4)">
      <rect x="-7" y="0" width="14" height="6" rx="2" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.1"/>
      <path d="M-7,6 V20 Q-7,28 1,28 H8 Q15,28 15,22 Q15,17 8,17 H7 V6Z" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2"/>
      <circle cx="1" cy="11" r="1.6" fill="#f472b6"/>
    </g>
  </g>

  <!-- 6 onesie (mint) -->
  <g transform="translate(330,28)">
    <path d="M-7,0 Q0,5 7,0 L18,6 L14,14 L9,11 V30 Q4,30 2,36 H-2 Q-4,30 -9,30 V11 L-14,14 L-18,6Z"
      fill="#bbf7d0" stroke="#15803d" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="0" cy="16" r="2.4" fill="#fde047"/>
  </g>

  <!-- 7 crescent moon (gold) -->
  <defs><mask id="cres"><rect x="-30" y="-10" width="60" height="60" fill="#fff"/><circle cx="8" cy="12" r="13" fill="#000"/></mask></defs>
  <g transform="translate(390,28)">
    <circle cx="0" cy="16" r="16" fill="#fde68a" stroke="#ca8a04" stroke-width="1.3" mask="url(#cres)"/>
    <circle cx="-9" cy="18" r="1.5" fill="#ca8a04"/>
    <path d="M14,2 l1.5,3 3,1.5 -3,1.5 -1.5,3 -1.5,-3 -3,-1.5 3,-1.5Z" fill="#fde047"/>
  </g>

  <!-- 8 little bell / ghanta (gold) -->
  <g transform="translate(450,24)">
    <circle cx="0" cy="1" r="3" fill="none" stroke="#ca8a04" stroke-width="1.3"/>
    <path d="M-12,26 Q-10,6 0,4 Q10,6 12,26Z" fill="#fcd34d" stroke="#ca8a04" stroke-width="1.3"/>
    <rect x="-14" y="25" width="28" height="4" rx="2" fill="#f59e0b"/>
    <circle cx="0" cy="32" r="3" fill="#ca8a04"/>
  </g>

  <!-- small pom-poms on the string -->
  <g>
    <circle cx="0" cy="8" r="4" fill="#f472b6"/><circle cx="240" cy="8" r="4" fill="#38bdf8"/><circle cx="480" cy="8" r="4" fill="#f472b6"/>
    <circle cx="60" cy="15" r="3" fill="#fde047"/><circle cx="120" cy="17" r="3" fill="#a78bfa"/><circle cx="180" cy="15" r="3" fill="#34d399"/>
    <circle cx="300" cy="15" r="3" fill="#fde047"/><circle cx="360" cy="17" r="3" fill="#a78bfa"/><circle cx="420" cy="15" r="3" fill="#34d399"/>
  </g>
</svg>
